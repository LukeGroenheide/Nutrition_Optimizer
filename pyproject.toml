[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nutrition-optimizer"
version = "0.1.0"
description = "Personal dining recommendation and meal reporting system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.16,<1",
    "cryptography>=42,<47",
    "openai>=1.66,<3",
    "pydantic>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
